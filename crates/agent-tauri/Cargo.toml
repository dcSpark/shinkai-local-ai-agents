[package]
name = "agent-tauri"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Agent Harness — Tauri v2 desktop UI."

[lib]
name = "agent_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "agent-harness"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
agent-core = { path = "../agent-core" }
agent-adapters = { path = "../agent-adapters" }
agent-bundles = { path = "../agent-bundles" }
agent-config = { path = "../agent-config" }
agent-ingest = { path = "../agent-ingest" }
agent-tracing = { path = "../agent-tracing" }
agent-llm = { path = "../agent-llm" }
agent-memory = { path = "../agent-memory" }
agent-skills = { path = "../agent-skills" }
agent-storage = { path = "../agent-storage" }
agent-tools = { path = "../agent-tools" }
tauri = { version = "2", features = [] }
tokio = { workspace = true, features = ["sync", "rt-multi-thread", "macros"] }
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true

[package]
name = "agent-tools"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Executable tool runtimes and registry for Shinkai."

[dependencies]
agent-adapters = { path = "../agent-adapters" }
agent-secrets = { path = "../agent-secrets" }
agent-storage = { path = "../agent-storage" }
async-trait.workspace = true
base64.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["io-util", "process", "time"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "multipart", "rustls"] }
uuid.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

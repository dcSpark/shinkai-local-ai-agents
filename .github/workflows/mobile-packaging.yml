name: Mobile Packaging

on:
  workflow_dispatch:
    inputs:
      platform:
        description: "Mobile target to initialize and verify"
        required: true
        default: all
        type: choice
        options:
          - all
          - android
          - ios
      build:
        description: "Build signed mobile package artifacts after initialization"
        required: true
        default: false
        type: boolean

concurrency:
  group: mobile-packaging-${{ github.ref }}-${{ github.event.inputs.platform || 'all' }}
  cancel-in-progress: false

env:
  CI: "true"
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: short
  CARGO_INCREMENTAL: "0"

jobs:
  android:
    name: android
    if: github.event.inputs.platform == 'all' || github.event.inputs.platform == 'android'
    runs-on: ubuntu-latest
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system deps for Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            build-essential

      - name: Install Rust toolchain and Android targets
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: true
          rustflags: ""

      - name: Install Android Rust targets
        run: rustup target add aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: crates/agent-tauri/frontend/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK and NDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"

      - name: Frontend npm ci
        working-directory: crates/agent-tauri/frontend
        run: npm ci

      - name: Initialize and verify Android Tauri project
        run: scripts/init-mobile-packaging.sh --platform=android

      - name: Prepare Android signing
        if: inputs.build
        run: scripts/prepare-mobile-signing.sh --platform=android

      - name: Build signed Android mobile artifacts
        if: inputs.build
        run: scripts/build-release-artifact.sh --platform=android

      - name: Upload Android mobile artifacts
        if: inputs.build
        uses: actions/upload-artifact@v4
        with:
          name: shinkai-android-mobile
          if-no-files-found: error
          path: |
            crates/agent-tauri/gen/android/app/build/outputs/apk/**/*.apk
            crates/agent-tauri/gen/android/app/build/outputs/bundle/**/*.aab
            target/release/bundle/**/latest.json
            target/release/bundle/**/*.sig

  ios:
    name: ios
    if: github.event.inputs.platform == 'all' || github.event.inputs.platform == 'ios'
    runs-on: macos-14
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain and iOS targets
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: true
          rustflags: ""

      - name: Install iOS Rust targets
        run: rustup target add aarch64-apple-ios aarch64-apple-ios-sim x86_64-apple-ios

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: crates/agent-tauri/frontend/package-lock.json

      - name: Install CocoaPods
        run: sudo gem install cocoapods

      - name: Frontend npm ci
        working-directory: crates/agent-tauri/frontend
        run: npm ci

      - name: Initialize and verify iOS Tauri project
        run: scripts/init-mobile-packaging.sh --platform=ios

      - name: Prepare iOS signing
        if: inputs.build
        run: scripts/prepare-mobile-signing.sh --platform=ios

      - name: Build signed iOS mobile artifacts
        if: inputs.build
        run: scripts/build-release-artifact.sh --platform=ios

      - name: Upload iOS mobile artifacts
        if: inputs.build
        uses: actions/upload-artifact@v4
        with:
          name: shinkai-ios-mobile
          if-no-files-found: error
          path: |
            crates/agent-tauri/gen/apple/build/**/*.ipa
            crates/agent-tauri/gen/apple/build/**/*.xcarchive
            target/release/bundle/**/latest.json
            target/release/bundle/**/*.sig

[workspace]
resolver = "3"
members = [
    "crates/agent-adapters",
    "crates/agent-api-client",
    "crates/agent-batch",
    "crates/agent-bundles",
    "crates/agent-capabilities",
    "crates/agent-compaction",
    "crates/agent-config",
    "crates/agent-conversations",
    "crates/agent-core",
    "crates/agent-daemon",
    "crates/agent-ingest",
    "crates/agent-tracing",
    "crates/agent-llm",
    "crates/agent-memory",
    "crates/agent-prompts",
    "crates/agent-sandbox",
    "crates/agent-secrets",
    "crates/agent-storage",
    "crates/agent-skills",
    "crates/agent-tools",
    "crates/agent-cli",
    "crates/agent-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0 OR MIT"
rust-version = "1.94"
authors = ["Shinkai contributors"]

[workspace.dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "io-std", "time", "process"] }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", default-features = false, features = ["serde", "clock"] }
clap = { version = "4", features = ["derive"] }
rig-core = "0.35"
rusqlite = { version = "0.32", features = ["bundled"] }
toml = "0.8"
tar = "0.4"
quick-xml = "0.38"
base64 = "0.22"
